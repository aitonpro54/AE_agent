<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Codex AE MCP Bridge</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Codex AE MCP Bridge</h1>
          <p id="status">Starting...</p>
        </div>
        <span id="badge">offline</span>
      </header>

      <section>
        <label>
          Bridge URL
          <input id="bridgeUrl" value="http://127.0.0.1:3456" />
        </label>
        <label>
          Token
          <input id="bridgeToken" type="password" />
        </label>
        <div class="actions">
          <button id="connectButton">Connect</button>
          <button id="disconnectButton">Disconnect</button>
        </div>
      </section>

      <section>
        <h2>Activity</h2>
        <pre id="log"></pre>
      </section>
    </main>

    <script src="./lib/CSInterface.js"></script>
    <script src="./panel.js"></script>
  </body>
</html>
