<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>AE Agent Core 3.3.5</title>
    <script>
      (function () {
        var search=String(window.location.search || "");
        function queryValue(name){var match=search.match(new RegExp("[?&]"+name+"=([^&]+)"));return match?decodeURIComponent(match[1].replace(/\+/g," ")):"";}
        window.__aeAgentAssetVersion=queryValue("assets") || queryValue("reload") || "3.3.5";
      })();
      document.write('<link rel="stylesheet" href="./style.css?v='+encodeURIComponent(window.__aeAgentAssetVersion)+'" />');
    </script>
  </head>
  <body>
    <main id="appShell" class="app-shell">
      <section class="bridge-section">
        <h1 id="appTitle">AE Agent Core <span id="appVersion">3.3.5</span></h1>
        <div class="connection-row"><span id="status">Запуск…</span><span id="badge">offline</span></div>
        <label>Bridge URL<input id="bridgeUrl" value="http://127.0.0.1:3456" /></label>
        <label>Токен панели<input id="bridgeToken" type="password" autocomplete="off" /></label>
        <div class="action-group"><button id="connectButton">Подключить</button><button id="disconnectButton">Отключить</button><button id="reloadButton">Перезагрузить панель</button></div>
        <p id="bridgeHelp" class="bridge-help">Ожидание локального bridge.</p>
        <div class="autonomous-session-control"><button id="autonomousSessionButton" aria-pressed="false">Автономная сессия Codex</button><span id="autonomousSessionStatus" aria-live="polite">Состояние недоступно</span></div>
        <p class="autonomous-session-help">Готовые typed-планы требуют защиты и проверки. Raw JSX, удаление и сохранение подтверждаются вручную.</p>
      </section>
      <section class="plan-section">
        <h2>Текущий план</h2>
        <button id="refreshPlanButton">Обновить план из bridge</button>
        <pre id="currentBridgePlan" class="bridge-help" aria-live="polite"></pre>
        <div class="plan-actions"><button id="dryRunPlanButton" disabled>Подготовить и проверить</button><button id="runPlanButton" disabled>Выполнить план</button><button id="reconcilePlanRunButton" disabled>Сверить результат</button></div>
        <p id="planRunStatus" class="plan-run-status" aria-live="polite">Нет текущего плана.</p>
        <pre id="planResult" aria-live="polite"></pre>
      </section>
      <p id="log" class="bridge-help" aria-live="polite"></p>

    </main>
    <script>
      document.write('<script src="./lib/CSInterface.js?v='+encodeURIComponent(window.__aeAgentAssetVersion)+'"><\/script>');
      document.write('<script src="./panel-action-contract.js?v='+encodeURIComponent(window.__aeAgentAssetVersion)+'"><\/script>');
      document.write('<script src="./native-probe-startup-guard.js?v='+encodeURIComponent(window.__aeAgentAssetVersion)+'"><\/script>');
    </script>
  </body>
</html>
